{% extends 'core/app_base.html' %}
{% load static %}
{% block content %}
  <div class="creation-layout">
    <section class="creation-preview listing-preview" aria-labelledby="preview-title">
      <h2 id="preview-title" class="eyebrow">Listing preview</h2>
      <img class="preview-image" src="{% static 'core/images/image29.jpg' %}" alt="Mini-fridge">
      <div class="d-flex justify-content-between gap-3">
        <h3>Mini-Fridge, barely used</h3>
        <span class="muted preview-price">Price</span>
      </div>
      <p class="muted">Description</p>
    </section>
    <section class="creation-fields" aria-labelledby="form-title">
      <h2 id="form-title" class="eyebrow">Post a new listing</h2>
      <label for="listing-title">Title</label>
      <input id="listing-title" class="form-control" value="Mini-Fridge, barely used">
      <div class="row g-3">
        <div class="col-sm-6">
          <label for="listing-price">Price</label>
          <input id="listing-price" class="form-control" inputmode="decimal" placeholder="＄">
        </div>
        <div class="col-sm-6">
          <label for="listing-category">Category</label>
          <select id="listing-category" class="form-select">
            <option selected>Select</option>
          </select>
        </div>
      </div>
      <label for="listing-description">Description</label>
      <textarea id="listing-description" class="form-control" rows="2" placeholder="Condition, pickup details…"></textarea>
      <span class="form-label">Photo — at least one required</span>
      <button type="button" class="upload-placeholder" disabled>
        <img src="{% static 'core/images/image140.png' %}" alt="">
        Upload photo: IMG9770.png uploaded
      </button>
      <button class="btn btn-maroon post-button" type="button" disabled>Post Listing</button>
    </section>
  </div>
{% endblock %}
